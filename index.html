<!doctype html>
<html>
    <head>
        <title>FIT2102 A1 2026</title>
    </head>
    <body>
        <h1>Flippy Bit</h1>
        <main id="main" class="flex col">
            <svg id="svgCanvas" width="600" height="400">
                <g id="gameOver" visibility="hidden">
                    <rect
                        x="225"
                        y="176"
                        fill="white"
                        height="48"
                        width="150"
                    ></rect>
                    <text x="235" y="206">Game Over</text>
                </g>
            </svg>
            <div id="sideBar" class="flex col">
                <div id="info" class="flex col">
                    <div class="text">
                        <span class="left">Score: </span>
                        <span class="right" id="scoreText">...</span>
                    </div>
                    <button id="restartButton" type="button">
                        Restart game
                    </button>
                    <section id="challenges">
                        <h2>Challenges</h2>
                        <ul>
                            <li id="challengeScoreTen">
                                <span class="trophy">○</span>
                                Reach score 10
                            </li>
                            <li id="challengeFastFive">
                                <span class="trophy">○</span>
                                Solve 5 in 15 seconds
                            </li>
                            <li id="challengeScoreTwenty">
                                <span class="trophy">○</span>
                                Reach score 20 without a mistake
                            </li>
                        </ul>
                    </section>
                    <section id="scoreHistoryPanel">
                        <h2>Score history</h2>
                        <p id="emptyScoreHistory">
                            No previous games
                        </p>
                        <ol id="scoreHistory"></ol>
                    </section>
                </div>
            </div>
        </main>
        <script type="module" src="./src/main.ts"></script>
    </body>
</html>
